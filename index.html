function facts() {
  let total = 0, code = 0, shared = 0, sharedN = 0, save = 0; const first = new Set();
  for (const o of D.ov) { total += o[1]; code += o[2]; }
  for (const f of D.fn) if (f[2]) { shared += f[1]; sharedN++; if (first.has(f[2])) save += f[1]; else first.add(f[2]); }
  const F = document.getElementById('facts'); F.replaceChildren();
  const add = (b, s) => { const d = el('div'); d.append(el('b', b), el('span', ' ' + s)); F.append(d); };
  add(fmt(total), 'in ' + D.ov.length + ' files'); add(pct(code, total), 'of that is code (' + fmt(code) + ')');
  add(sharedN + ' of ' + D.fn.length, 'functions are copies (' + pct(shared, code) + ' of code bytes)');
  add(fmt(save), 'of code goes if each of the ' + first.size + ' families is written once');
}

function size() { const w = cv.parentElement.clientWidth - 6; cv.style.height = Math.round(w < 560 ? w*1.3 : Math.min(Math.max(w*0.6, 420), 720)) + 'px'; }
function refresh() { size(); build(); draw(); }
function setView(v) { view = v; sel = hover = null; for (const b of document.querySelectorAll('.seg button')) b.setAttribute('aria-pressed', b.id === 'v-' + v); legend(); refresh(); readout(null); }

for (const v of ['files', 'roll', 'code', 'fam']) document.getElementById('v-' + v).addEventListener('click', () => setView(v));
cv.addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; const t = hit(e); if (t !== hover) { hover = t; draw(); if (!sel) readout(t); } });
cv.addEventListener('pointerleave', () => { hover = null; draw(); if (!sel) readout(null); });
cv.addEventListener('click', e => { const t = hit(e);
  const same = t && sel && (view === 'files' || view === 'roll' ? t.ov === sel.ov : (t.fam ? t.fam === sel.fam : t === sel));
  sel = same ? null : t; draw(); readout(sel); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(refresh, 120); });
const retheme = () => { readColors(); draw(); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
readColors(); facts(); setView('roll');
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>
</body>
